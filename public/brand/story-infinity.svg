<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="loop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e51e51"/>
      <stop offset="100%" stop-color="#9089fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e51e51" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e51e51" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg1)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/>
    <circle cx="900" cy="100" r="2"/><circle cx="1000" cy="100" r="2"/><circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="800" r="2"/><circle cx="200" cy="800" r="2"/><circle cx="300" cy="800" r="2"/>
    <circle cx="900" cy="800" r="2"/><circle cx="1000" cy="800" r="2"/><circle cx="1100" cy="800" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="100" cy="300" r="2"/>
    <circle cx="1100" cy="200" r="2"/><circle cx="1100" cy="300" r="2"/>
    <circle cx="100" cy="600" r="2"/><circle cx="100" cy="700" r="2"/>
    <circle cx="1100" cy="600" r="2"/><circle cx="1100" cy="700" r="2"/>
  </g>

  <circle cx="600" cy="450" r="320" fill="url(#glow1)"/>

  <!-- infinity loop -->
  <path d="M 420 450
           C 420 370, 490 370, 540 420
           C 590 470, 610 530, 660 480
           C 710 430, 780 430, 780 450
           C 780 530, 710 530, 660 480
           C 610 430, 590 370, 540 420
           C 490 470, 420 530, 420 450 Z"
        fill="none" stroke="url(#loop1)" stroke-width="10" stroke-linecap="round"/>

  <circle cx="540" cy="420" r="9" fill="#ffffff"/>
  <circle cx="660" cy="480" r="9" fill="#ffffff"/>

  <text x="600" y="700" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">AURYN</text>
  <text x="600" y="734" font-family="Arial, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" letter-spacing="2">SONSUZLUK &amp; BAĞLILIK</text>
</svg>
